[workspace]
members = [
    "crates/precious-cli",
    "crates/precious-core",
    "crates/precious-tf",
    "crates/precious-pricing",
    "crates/precious-providers",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/polymath-as/precious"
rust-version = "1.85"

[workspace.dependencies]
precious-core = { path = "crates/precious-core" }
precious-tf = { path = "crates/precious-tf" }
precious-pricing = { path = "crates/precious-pricing" }
precious-providers = { path = "crates/precious-providers" }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Error handling
thiserror = "2"

# Currency / decimal
rust_decimal = { version = "1", features = ["serde-with-str"] }

# Async
tokio = { version = "1", features = ["full"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Collections
indexmap = { version = "2", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
miette = { version = "7", features = ["fancy"] }

# Terraform
hcl-rs = "0.18"

# Filesystem
directories = "6"
time = { version = "0.3", features = ["serde"] }

# Testing
insta = { version = "1", features = ["yaml"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
